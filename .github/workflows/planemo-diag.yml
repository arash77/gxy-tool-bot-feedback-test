# Diagnostic: planemo test on the demo tool as the job user and as an exec
# user (wrapped as gxy-tool-bot does), to compare the two.
on:
  workflow_dispatch:
    inputs:
      as:
        type: choice
        options: [runner, gxyexec]

permissions:
  contents: read

jobs:
  planemo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: feedback-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "planemo>=0.75.43"
      - name: Install micromamba
        run: |
          curl -Ls "https://micro.mamba.pm/api/micromamba/linux-64/latest" | tar -xvj -C /tmp
          echo "/tmp/bin" >> $GITHUB_PATH
      - name: Create the exec user
        if: inputs.as == 'gxyexec'
        run: |
          sudo useradd -M -s /usr/sbin/nologin gxyexec
          d="$GITHUB_WORKSPACE/tools"
          while [ "$d" != / ]; do chmod o+x "$d" 2>/dev/null || true; d=$(dirname "$d"); done
          chmod -R a+rwX tools/demo
      - name: planemo test
        env:
          AS: ${{ inputs.as }}
        run: |
          REPORT=$(mktemp --suffix .json); chmod 666 "$REPORT"
          CMD=(planemo test --test_output_json "$REPORT" "$GITHUB_WORKSPACE/tools/demo/demo.xml")
          if [ "$AS" = gxyexec ]; then
            H=/tmp/gxy-exec-home
            CMD=(sudo -n -u gxyexec env -i "PATH=$PATH" "HOME=$H" "USER=gxyexec" "LOGNAME=gxyexec" "MAMBA_ROOT_PREFIX=$H/mamba" sh -c 'umask 000; mkdir -p "$HOME"; exec "$@"' sh "${CMD[@]}")
          fi
          cd tools/demo
          set +e; timeout 900 "${CMD[@]}" > /tmp/out.txt 2> /tmp/err.txt; rc=$?; set -e
          echo "DIAG exit code: $rc"; echo "DIAG report bytes: $(wc -c < "$REPORT")"
          echo "----- stdout (last 40)"; tail -40 /tmp/out.txt
          echo "----- stderr lines mentioning error/fail/exception (last 40)"; grep -iE "error|fail|exception|traceback|denied" /tmp/err.txt | tail -40
