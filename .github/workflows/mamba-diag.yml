# Diagnostic for gxy-tool-bot#37: micromamba create through the bot's own
# exec-user wrapper and environment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-cache-dir "git+https://github.com/arash77/gxy-tool-bot@c98eb5d9bcda28dbfd2f1c2f7687d731763166c5"
      - name: Install micromamba
        run: |
          curl -Ls "https://micro.mamba.pm/api/micromamba/linux-64/latest" | tar -xvj -C /tmp
          echo "/tmp/bin" >> $GITHUB_PATH
      - name: Create through the bot's wrapper
        run: |
          sudo useradd -M -s /usr/sbin/nologin gxyexec
          GXY_TOOL_BOT_EXEC_USER=gxyexec python - <<'PY'
          import shutil, subprocess
          from gxy_tool_bot.generator import _as_exec_user
          from gxy_tool_bot.utils import sanitized_env
          env = sanitized_env(set())
          print("env vars passed:", sorted(k for k in env if "CONDA" in k or "MAMBA" in k or k in ("PWD", "TMPDIR", "XDG_CACHE_HOME")))
          cmd = [shutil.which("micromamba"), "create", "-y", "-p", "/tmp/gxy_conda_diag", "-c", "bioconda", "-c", "conda-forge", "coreutils"]
          r = subprocess.run(_as_exec_user(cmd, env), capture_output=True, text=True, env=env)
          print("DIAG exit", r.returncode)
          for line in (r.stderr + r.stdout).splitlines():
              if line.startswith(("critical", "error", "warning")) or "denied" in line.lower():
                  print("  ", line[:220])
          PY
