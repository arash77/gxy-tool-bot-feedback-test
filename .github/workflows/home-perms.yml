# Diagnostic for gxy-tool-bot#37: what an unprivileged user can reach under
# the runner's home before and after opening traversal to the workspace.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check
        run: |
          sudo useradd -M -s /usr/sbin/nologin gxyexec
          stat -c 'before: %A %U %n' /home/runner /home/runner/work "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
          echo "gxyexec can list /home/runner before: $(sudo -u gxyexec ls /home/runner >/dev/null 2>&1 && echo yes || echo no)"
          d="$GITHUB_WORKSPACE/tools"; mkdir -p "$d"
          while [ "$d" != / ]; do chmod o+x "$d" 2>/dev/null || true; d=$(dirname "$d"); done
          stat -c 'after: %A %U %n' /home/runner /home/runner/work
          echo "--- top-level entries of /home/runner (as root)"; sudo ls -la /home/runner | awk '{print $1, $3, $NF}'
          for p in /home/runner/actions-runner /home/runner/.docker /home/runner/.config /home/runner/work/_temp; do
            echo "--- $p as gxyexec: list=$(sudo -u gxyexec ls "$p" >/dev/null 2>&1 && echo yes || echo no)"
            sudo -u gxyexec find "$p" -maxdepth 3 -type f -readable 2>/dev/null | sed 's#^#  readable: #' | head -15
          done
          echo "--- secret-looking names readable by gxyexec there"
          sudo -u gxyexec find /home/runner/actions-runner /home/runner/.docker /home/runner/.config /home/runner/work/_temp -maxdepth 5 -type f -readable \( -iname '*cred*' -o -iname '.runner*' -o -iname '*token*' -o -iname '*.key' -o -iname 'config.json' -o -iname 'hosts.yml' \) 2>/dev/null | head
